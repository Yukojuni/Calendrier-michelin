[build]
  command = "bash tools/netlify_build.sh"
  publish = "build/web"

# API (congés et scores partagés) : Netlify Functions + Netlify Blobs.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
